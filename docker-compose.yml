services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jawad
      POSTGRES_PASSWORD: jawad
      POSTGRES_DB: jawad_engine
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jawad -d jawad_engine"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["node", "--experimental-strip-types", "scripts/migrate.ts"]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://jawad:jawad@postgres:5432/jawad_engine
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  web:
    build: .
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://jawad:jawad@postgres:5432/jawad_engine
      REDIS_URL: redis://redis:6379
      ATTACHMENT_ROOT: /app/runtime/uploads
    volumes: ["uploads_data:/app/runtime/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${LOCAL_WEB_PORT:-3100}:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  bot:
    build: .
    command: ["node", "--experimental-strip-types", "apps/bot/src/index.ts"]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://jawad:jawad@postgres:5432/jawad_engine
      REDIS_URL: redis://redis:6379
      TELEGRAM_UPDATE_MODE: long_polling
      BOT_HEALTH_PORT: ${LOCAL_BOT_HEALTH_PORT:-3101}
      TELEGRAM_WEBHOOK_PORT: ""
      ATTACHMENT_ROOT: /app/runtime/uploads
    volumes: ["uploads_data:/app/runtime/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${LOCAL_BOT_HEALTH_PORT:-3101}:${LOCAL_BOT_HEALTH_PORT:-3101}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LOCAL_BOT_HEALTH_PORT:-3101}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "--experimental-strip-types", "apps/worker/src/index.ts"]
    env_file: ${COMPOSE_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://jawad:jawad@postgres:5432/jawad_engine
      REDIS_URL: redis://redis:6379
      WORKER_HEALTH_PORT: ${LOCAL_WORKER_HEALTH_PORT:-3200}
      ATTACHMENT_ROOT: /app/runtime/uploads
    volumes: ["uploads_data:/app/runtime/uploads"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:${LOCAL_WORKER_HEALTH_PORT:-3200}:${LOCAL_WORKER_HEALTH_PORT:-3200}"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${LOCAL_WORKER_HEALTH_PORT:-3200}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
volumes:
  postgres_data: {}
  redis_data: {}
  uploads_data: {}
